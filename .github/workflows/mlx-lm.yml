name: MLX-LM Text Generation

on:
  workflow_dispatch:  # Allows manual trigger
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  generate-text:
    # Note: MLX requires Apple Silicon (M1/M2/M3). 
    # For this to work in production, you'd need a self-hosted runner on macOS with Apple Silicon.
    # Using macos-latest as it's the closest available option on GitHub Actions.
    runs-on: macos-latest
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade mlx-lm
      
      - name: Run MLX-LM text generation
        run: |
          python generate_text.py
